name: qwen36_small
model:
  architecture: qwen36
  vocab_size: 64
  context_length: 8
  d_model: 32
  num_layers: 4
  num_heads: 4
  num_kv_heads: 2
  d_ff: 64
  tie_embeddings: true
  norm_type: rmsnorm
  activation: swiglu
  ffn_type: swiglu
  attention_type: hybrid
  position_encoding: rope
  partial_rotary_factor: 0.5
  full_attention_interval: 4
  mtp_layers: 1
training:
  batch_size: 2
  dtype: float32
  device: cpu
