name: original_small
model:
  architecture: original_transformer
  vocab_size: 64
  context_length: 8
  d_model: 32
  num_layers: 2
  num_heads: 4
  num_kv_heads: 4
  d_ff: 64
  tie_embeddings: true
  norm_type: layernorm
  activation: relu
  ffn_type: relu
  attention_type: mha
  position_encoding: sinusoidal
training:
  batch_size: 2
  dtype: float32
  device: cpu
