name: qwen36_100m_500m_tokens
model:
  architecture: qwen36
  vocab_size: 16384
  context_length: 1024
  d_model: 720
  num_layers: 12
  num_heads: 12
  num_kv_heads: 4
  d_ff: 1920
  tie_embeddings: true
  norm_type: rmsnorm
  activation: swiglu
  ffn_type: swiglu
  attention_type: hybrid
  position_encoding: rope
  rope_theta: 10000000.0
  partial_rotary_factor: 0.25
  qk_norm: true
  full_attention_interval: 4
  mtp_layers: 1
  mtp_loss_weight: 0.1
data:
  train_data: data/tokens/bpe_16k/train.npy
  val_data: data/tokens/bpe_16k/val.npy
  tokenizer_path: data/tokenizers/bpe_16k
  dataset_dtype: uint16
training:
  batch_size: 8
  max_iters: 60000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_iters: 2000
  cosine_cycle_iters: 60000
  dtype: bfloat16
  device: cuda
runtime:
  checkpoint_dir: checkpoints/qwen36_500m_tokens
  run_dir: runs/qwen36_500m_tokens
