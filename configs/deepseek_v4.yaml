name: deepseek_v4_100m
model:
  architecture: deepseek_v4
  vocab_size: 16384
  context_length: 1024
  d_model: 640
  num_layers: 8
  num_heads: 10
  num_kv_heads: 1
  d_ff: 512
  expert_d_ff: 512
  tie_embeddings: true
  norm_type: rmsnorm
  activation: swiglu
  ffn_type: moe
  attention_type: hybrid
  position_encoding: rope
  rope_theta: 1000000.0
  partial_rotary_factor: 0.25
  qk_norm: true
  local_window: 128
  num_experts: 8
  active_experts: 2
  shared_experts: 1
  router_score: sqrtsoftplus
  residual_streams: 2
  compressed_topk: 64
  compression_ratio: 4
  mtp_layers: 1
  mtp_loss_weight: 0.1
training:
  batch_size: 8
  max_iters: 1000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_iters: 100
  cosine_cycle_iters: 1000
  dtype: bfloat16
  device: cuda
runtime:
  checkpoint_dir: checkpoints/deepseek_v4
  run_dir: runs/deepseek_v4
